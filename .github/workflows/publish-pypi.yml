name: publish-pypi
# Publishes the Python engine to PyPI when a GitHub Release is published.
# Uses PyPI "trusted publishing" (OIDC): no API token is stored anywhere.
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build python
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: python/dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
